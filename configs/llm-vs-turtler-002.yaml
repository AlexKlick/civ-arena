# M11 strategy-plane validation: same duel as llm-vs-turtler-001 (identical
# seed and agents), with the typed memory tools in the model's hands.
# The api key is NEVER inline — only the env var NAME lives here.
schema: 2
match:
  execution_mode: dag_tx
  scored: false
  max_graph_actions: 1024
  max_replans_per_turn: 2
  match_id: llm-vs-turtler-002
  seed: 947381
  max_turns: 40
  checkpoint_every: 1        # paid inference: lose at most one turn on resume
  adapter: simulator
  watchdog_mode: flag_and_continue
  violation_limit: 5

agents:
  - agent_id: minimax-m3
    player_id: 0
    policy: llm
    seed: 1101
    llm:
      base_url: "https://api.minimax.io/anthropic/v1"
      api_key_env: "ANTHROPIC_AUTH_TOKEN_MINIMAX2"   # sk-cp coding-plan key
      model_id: "MiniMax-M3"
      max_tokens: 4096
      max_tool_rounds: 16
      max_result_chars: 8000
      request_timeout_s: 120
      max_retries: 2
      max_requests_per_match: 2000
  - agent_id: korean-turtler
    player_id: 1
    policy: turtler
    seed: 2202

chaos: []
