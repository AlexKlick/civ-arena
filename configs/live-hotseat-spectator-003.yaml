# NEXT-05 sealed qualification recording (dataset-evidence-card §6): LIVE
# 1v1, BOTH seats MiniMax-M3 via the MiniMax provider. Wiring cloned from
# live-hotseat-llm-minimax2-001.yaml (probe-verified provider path);
# the ONLY deltas are match_id and `spectator_capture: true` — the
# firetuner-only flag (config.py:302, :420-427) that writes one
# omniscient `spectator_world` audit at baseline (after_seat=-1) and
# after every completed seat turn, visibility_scope="spectator" (never
# enters any model packet).
match:
  match_id: live-hotseat-spectator-003
  seed: 271183
  max_turns: 30
  checkpoint_every: 5
  adapter: firetuner
  watchdog_mode: flag_and_continue
  violation_limit: 10
  completeness_gate: true
  declare_own_endpath_drift: true
  spectator_capture: true

agents:
  - agent_id: minimax-m3-seat0
    player_id: 0
    policy: llm
    seed: 11
    llm:
      base_url: "https://api.minimax.io/anthropic/v1"
      api_key_env: "ANTHROPIC_AUTH_TOKEN_MINIMAX2"   # sk-cp coding-plan key
      model_id: "MiniMax-M3"
      max_tokens: 4096
      max_tool_rounds: 16
      max_result_chars: 8000
      request_timeout_s: 120
      max_retries: 2
      max_requests_per_match: 2000
  - agent_id: minimax-m3-seat1
    player_id: 1
    policy: llm
    seed: 22
    llm:
      base_url: "https://api.minimax.io/anthropic/v1"
      api_key_env: "ANTHROPIC_AUTH_TOKEN_MINIMAX2"   # sk-cp coding-plan key
      model_id: "MiniMax-M3"
      max_tokens: 4096
      max_tool_rounds: 16
      max_result_chars: 8000
      request_timeout_s: 120
      max_retries: 2
      max_requests_per_match: 2000

chaos: []
